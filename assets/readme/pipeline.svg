<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="One prompt through the airlock: commit, token, strip, pad, tick, seal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="300" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="18" fill="none" stroke="#2a3644"/>
  <text x="40" y="50" class="mono" font-size="18" letter-spacing="3" fill="#22d3c5">ONE PROMPT THROUGH THE AIRLOCK</text>

  <path d="M120 170 H1160" stroke="#3a4654" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- Six seals. Each lights up while the packet (8 s loop) passes it. -->
  <g class="sans" text-anchor="middle">
    <g>
      <rect x="40" y="110" width="160" height="120" rx="10" fill="#0e151d" stroke="#ff3b5c" stroke-opacity="0.35" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.04;0.16;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="120" y="152" font-size="16" class="mono" fill="#ff8a9d" letter-spacing="2">01</text>
      <text x="120" y="184" font-size="26" font-weight="700" fill="#e8eef5">Commit</text>
      <text x="120" y="212" font-size="17" fill="#8a98a8">salted SHA-256</text>
    </g>
    <g>
      <rect x="240" y="110" width="160" height="120" rx="10" fill="#0e151d" stroke="#b46cff" stroke-opacity="0.35" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.13;0.18;0.3;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="320" y="152" font-size="16" class="mono" fill="#c99bff" letter-spacing="2">02</text>
      <text x="320" y="184" font-size="26" font-weight="700" fill="#e8eef5">Token</text>
      <text x="320" y="212" font-size="17" fill="#8a98a8">HMAC caveats</text>
    </g>
    <g>
      <rect x="440" y="110" width="160" height="120" rx="10" fill="#0e151d" stroke="#3d7dff" stroke-opacity="0.35" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.27;0.32;0.44;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="520" y="152" font-size="16" class="mono" fill="#8fb1ff" letter-spacing="2">03</text>
      <text x="520" y="184" font-size="26" font-weight="700" fill="#e8eef5">Strip</text>
      <text x="520" y="212" font-size="17" fill="#8a98a8">no identity</text>
    </g>
    <g>
      <rect x="640" y="110" width="160" height="120" rx="10" fill="#0e151d" stroke="#34d399" stroke-opacity="0.35" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.41;0.46;0.58;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="720" y="152" font-size="16" class="mono" fill="#7ee0b0" letter-spacing="2">04</text>
      <text x="720" y="184" font-size="26" font-weight="700" fill="#e8eef5">Pad</text>
      <text x="720" y="212" font-size="17" fill="#8a98a8">4096 B always</text>
    </g>
    <g>
      <rect x="840" y="110" width="160" height="120" rx="10" fill="#0e151d" stroke="#f5b83d" stroke-opacity="0.35" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35" keyTimes="0;0.55;0.6;0.72;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="920" y="152" font-size="16" class="mono" fill="#f5c766" letter-spacing="2">05</text>
      <text x="920" y="184" font-size="26" font-weight="700" fill="#e8eef5">Tick</text>
      <text x="920" y="212" font-size="17" fill="#8a98a8">250 ms beat</text>
    </g>
    <g>
      <rect x="1040" y="110" width="200" height="120" rx="10" fill="#0e151d" stroke="#22d3c5" stroke-opacity="0.35" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.35;0.35;1;1;0.35" keyTimes="0;0.69;0.74;0.95;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="1140" y="152" font-size="16" class="mono" fill="#7be8de" letter-spacing="2">06</text>
      <text x="1140" y="184" font-size="26" font-weight="700" fill="#e8eef5">Seal</text>
      <text x="1140" y="212" font-size="17" fill="#8a98a8">hash-chained ledger</text>
    </g>
  </g>

  <!-- The packet: raw size until Pad, then a fixed envelope; it waits at Tick for the beat -->
  <g>
    <animateMotion path="M120 262 H1140" keyPoints="0;0.58;0.58;1;1" keyTimes="0;0.55;0.62;0.74;1" dur="8s" repeatCount="indefinite"/>
    <rect x="-14" y="-7" width="28" height="14" rx="2" fill="#ff3b5c">
      <animate attributeName="width" values="28;28;56;56" keyTimes="0;0.42;0.46;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x" values="-14;-14;-28;-28" keyTimes="0;0.42;0.46;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ff3b5c;#ff3b5c;#7be8de;#7be8de" keyTimes="0;0.42;0.46;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="1240" y="50" text-anchor="end" class="mono" font-size="16" fill="#5f6e7e">red = raw prompt · teal = sealed envelope</text>
</svg>
